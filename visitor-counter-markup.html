<!-- Tampal blok ini sebelum </body> dalam index.html -->
<section id="visitor-counter-panel" aria-label="Statistik pelawat" style="max-width:1100px;margin:28px auto;padding:18px 16px;border:1px solid #1b8eb5;border-radius:18px;background:linear-gradient(135deg,#071522,#0b2638);color:#eafaff;box-shadow:0 10px 28px #0003;font-family:inherit">
  <h2 style="margin:0 0 14px;text-align:center;font-size:clamp(18px,3vw,25px);color:#8de7ff">Statistik Pelawat Website</h2>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
    <div style="padding:16px;border-radius:12px;background:#0d3145;text-align:center">
      <div style="font-size:14px;opacity:.85">Jumlah pelawat keseluruhan</div>
      <div id="visitor-total" aria-live="polite" style="font-size:clamp(28px,5vw,40px);font-weight:800;margin-top:6px">Memuatkan…</div>
    </div>
    <div style="padding:16px;border-radius:12px;background:#0d3145;text-align:center">
      <div style="font-size:14px;opacity:.85">Pelawat hari ini</div>
      <div id="visitor-today" aria-live="polite" style="font-size:clamp(28px,5vw,40px);font-weight:800;margin-top:6px">Memuatkan…</div>
    </div>
  </div>
  <p style="font-size:12px;opacity:.7;text-align:center;margin:12px 0 0">Statistik dikemas kini apabila halaman website dibuka.</p>
</section>
<script src="./visitor-counter.js" defer></script>
